      <text x="48" y="25" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600">Presupuesto por partidas</text>
    </g>
    <g transform="translate(380 0)">
      <circle cx="17" cy="17" r="17" fill="#d8b866"/>
      <path d="M10 17 l5 5 10-12" fill="none" stroke="#07101e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="25" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600">Garantía por escrito</text>
    </g>
  </g>

  <g transform="translate(72 1082)" filter="url(#shadow)">
    <rect width="610" height="98" rx="12" fill="url(#gold)"/>
    <text x="34" y="43" fill="#07101e" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="700" letter-spacing="1.6">SOLICITA TU VALORACIÓN TÉCNICA</text>
    <text x="34" y="76" fill="#07101e" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700">WhatsApp 0422 799 7043</text>
    <path d="M553 49 h22 M567 35 l14 14 -14 14" fill="none" stroke="#07101e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
