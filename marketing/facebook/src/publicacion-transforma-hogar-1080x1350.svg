  <text x="72" y="1254" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="600" letter-spacing="1.1">CARACAS  ·  VALENCIA  ·  SAN DIEGO  ·  CARABOBO</text>
  <text x="72" y="1292" fill="#d9ba68" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" letter-spacing="2">REMODELAT.NET</text>
