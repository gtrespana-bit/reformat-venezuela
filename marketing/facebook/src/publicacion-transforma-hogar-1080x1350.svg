<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07101e" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#07101e" stop-opacity="0.80"/>
      <stop offset="0.82" stop-color="#07101e" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#07101e" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#07101e" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#07101e" stop-opacity="0.76"/>
      <stop offset="1" stop-color="#07101e" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c69d45"/>
      <stop offset="0.5" stop-color="#efd58e"/>
      <stop offset="1" stop-color="#bd9140"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1080" height="1350" fill="#07101e"/>
  <image x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice" href="../../../public/images/hero-lcp.webp" xlink:href="../../../public/images/hero-lcp.webp"/>
  <rect width="1080" height="1350" fill="url(#shade)"/>
  <rect width="1080" height="1350" fill="url(#floor)"/>

  <!-- Líneas arquitectónicas -->
  <g fill="none" stroke="#d8b968" stroke-opacity="0.22" stroke-width="2">
    <path d="M0 214 L208 76 L397 76"/>
    <path d="M0 235 L220 92 L397 92"/>
    <path d="M925 1120 L1080 1023 M951 1151 L1080 1070"/>
  </g>

  <image x="70" y="54" width="330" height="89" preserveAspectRatio="xMinYMid meet" href="../../../public/images/logo-header.webp" xlink:href="../../../public/images/logo-header.webp"/>

  <g transform="translate(780 62)">
    <rect width="230" height="50" rx="25" fill="#07101e" fill-opacity="0.72" stroke="#d6b664" stroke-opacity="0.8"/>
    <text x="115" y="33" text-anchor="middle" fill="#f8f3e7" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" letter-spacing="1.7">23+ AÑOS</text>
  </g>

  <text x="72" y="310" fill="#e2c475" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" letter-spacing="4.2">REMODELACIONES DE ALTO ESTÁNDAR</text>
  <rect x="72" y="334" width="72" height="4" rx="2" fill="url(#gold)"/>

  <g font-family="DejaVu Serif, serif" font-weight="700" font-size="78">
    <text x="70" y="442" fill="#ffffff">Tu hogar,</text>
    <text x="70" y="535" fill="#ffffff">como siempre</text>
    <text x="70" y="628" fill="#e5c978">lo imaginaste.</text>
  </g>

  <text x="74" y="702" fill="#f4f1e9" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400">
    <tspan x="74" dy="0">Planificamos y ejecutamos cada detalle</tspan>
    <tspan x="74" dy="39">para lograr un resultado pensado para durar.</tspan>
  </text>

  <g transform="translate(72 814)" filter="url(#shadow)">
    <rect width="782" height="74" rx="37" fill="#07101e" fill-opacity="0.86" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="36" cy="37" r="6" fill="#d9ba68"/>
    <text x="59" y="46" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" letter-spacing="0.4">COCINAS</text>
    <circle cx="242" cy="37" r="4" fill="#d9ba68"/>
    <text x="264" y="46" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" letter-spacing="0.4">BAÑOS</text>
    <circle cx="416" cy="37" r="4" fill="#d9ba68"/>
    <text x="438" y="46" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="600" letter-spacing="0.4">REFORMAS INTEGRALES</text>
  </g>

  <g transform="translate(72 988)">
