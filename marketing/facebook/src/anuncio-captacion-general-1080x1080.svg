    <circle cx="48" cy="46" r="25" fill="#ffffff" fill-opacity="0.16"/>
    <path d="M39 34 C36 38 37 47 44 54 C51 61 60 62 64 59 L58 51 L52 54 C48 52 44 48 43 44 L46 39 Z" fill="#ffffff"/>
