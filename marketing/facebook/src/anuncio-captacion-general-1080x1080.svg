    <text x="87" y="69" fill="#ffffff" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700">0422 799 7043</text>
    <path d="M534 46 h22 M547 33 l13 13 -13 13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
