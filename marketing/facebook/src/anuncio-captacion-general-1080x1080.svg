  <text x="58" y="356" fill="#ffffff" font-family="DejaVu Serif, serif" font-size="77" font-weight="700">¿Vas a</text>
  <text x="58" y="441" fill="#e5c878" font-family="DejaVu Serif, serif" font-size="77" font-weight="700">remodelar?</text>
  <text x="62" y="503" fill="#eef1f3" font-family="DejaVu Sans, sans-serif" font-size="24">
