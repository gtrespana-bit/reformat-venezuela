    <g transform="translate(0 57)"><circle cx="16" cy="16" r="16" fill="#d7b866"/><path d="M9 16 l5 5 9-11" fill="none" stroke="#081220" stroke-width="3" stroke-linecap="round"/><text x="43" y="24">Supervisión técnica</text></g>
    <g transform="translate(0 114)"><circle cx="16" cy="16" r="16" fill="#d7b866"/><path d="M9 16 l5 5 9-11" fill="none" stroke="#081220" stroke-width="3" stroke-linecap="round"/><text x="43" y="24">Garantía por escrito</text></g>
